<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0b2e">
<title>Confessions & Court 🍷</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍷</text></svg>">
<style>
:root{--bg:#1a0b2e;--card:#2a1450;--card2:#3a1d6b;--pink:#ff3d8b;--gold:#ffc93c;--teal:#2ee6c5;--txt:#fff;--mut:#c9b8ec;--red:#ff5a5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(circle at 20% 0%,#3b145f 0,var(--bg) 60%) fixed;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
#app{max-width:560px;margin:0 auto;padding:12px 14px 120px}
h1{font-size:2rem;margin:.2em 0;text-align:center;line-height:1.1}
h1 .a{color:var(--pink)}h1 .b{color:var(--gold)}
h2{margin:.3em 0 .5em;font-size:1.3rem}
.sub{color:var(--mut);text-align:center;margin:0 0 18px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 6px 24px #0006}
.prompt{background:linear-gradient(135deg,var(--pink),#9b3dff);border-radius:20px;padding:22px 18px;font-size:1.35rem;font-weight:800;text-align:center;line-height:1.3;box-shadow:0 8px 30px #ff3d8b55}
.prompt.court{background:linear-gradient(135deg,#ff8a00,var(--pink))}
.tag{display:inline-block;font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#0004;padding:4px 10px;border-radius:999px;margin-bottom:10px}
.howto{background:#ffffff12;border-left:4px solid var(--teal);border-radius:10px;padding:10px 12px;color:#e8e0ff;font-size:.95rem;margin:10px 0}
.howto b{color:var(--teal)}
input,textarea{width:100%;font-size:1.1rem;padding:14px;border-radius:14px;border:2px solid #ffffff22;background:#0003;color:#fff;outline:none;font-family:inherit}
input:focus,textarea:focus{border-color:var(--pink)}
textarea{min-height:100px;resize:vertical}
button{font:inherit;font-weight:800;font-size:1.1rem;border:0;border-radius:14px;padding:15px 16px;width:100%;margin:6px 0;color:#1a0b2e;background:var(--gold);cursor:pointer;transition:transform .08s}
button:active{transform:scale(.97)}
button.pink{background:var(--pink);color:#fff}button.teal{background:var(--teal)}button.ghost{background:#ffffff18;color:#fff}button.red{background:var(--red);color:#fff}
button:disabled{opacity:.45}
.row{display:flex;gap:8px}.row>*{flex:1}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{background:var(--card2);color:#fff;font-size:1rem;padding:14px 8px}
.pick button.sel{background:var(--teal);color:#1a0b2e}
.code{font-size:2.6rem;letter-spacing:.25em;font-weight:900;color:var(--gold);text-align:center;margin:4px 0}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#1a0b2ee6;backdrop-filter:blur(6px);padding:8px 2px;margin:-12px -2px 4px}
.top .rc{font-weight:900;color:var(--gold);letter-spacing:.15em}
.top button{width:auto;margin:0;padding:8px 12px;font-size:.9rem}
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:1.1rem;background:#0005;padding:6px 12px;border-radius:999px;min-width:64px;text-align:center}
.timer.low{background:var(--red);animation:pulse 1s infinite}
.big-timer{font-size:4.5rem;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;color:var(--gold)}
.big-timer.low{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.players{list-style:none;padding:0;margin:0}
.players li{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid #ffffff14}
.players li:last-child{border:0}
.pill{font-size:.8rem;background:#ffffff1c;border-radius:999px;padding:3px 9px;margin-left:6px;white-space:nowrap}
.done{color:var(--teal)}.off{opacity:.45}
.rules{background:#ffc93c18;border:1px dashed var(--gold);border-radius:14px;padding:8px 12px;margin:10px 0;font-size:.92rem}
.rules b{color:var(--gold)}
.rules ol{margin:4px 0 0;padding-left:20px}
.ans{background:var(--card2);border-radius:14px;padding:14px;margin:10px 0}
.ans .t{font-size:1.15rem;font-weight:700;margin-bottom:8px}
.ans .who{color:var(--gold);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{width:auto;flex:1 1 auto;padding:10px 12px;font-size:.95rem;margin:0;background:#ffffff18;color:#fff}
.chips button.sel{background:var(--teal);color:#1a0b2e}
.guilty{text-align:center;font-size:2.2rem;font-weight:900;color:var(--gold);margin:6px 0}
.bar{height:10px;background:#0005;border-radius:99px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--pink)}
.overlay{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:20px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:18px}
.modal h3{margin:.8em 0 .3em;color:var(--gold)}
.modal p,.modal li{color:#e8e0ff;line-height:1.45}
.wild{background:linear-gradient(135deg,var(--gold),#ff8a00);color:#1a0b2e;text-align:center}
.wild .big{font-size:1.4rem;font-weight:900;margin:10px 0}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#120722f0;display:flex;gap:8px;justify-content:center;z-index:6}
.dock button{max-width:270px;margin:0;padding:12px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-weight:700}
.center{text-align:center}.muted{color:var(--mut)}.small{font-size:.85rem}
.log{font-size:.8rem;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let pid=localStorage.getItem('pg_pid');if(!pid){pid=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('pg_pid',pid);}
const socket=io({transports:['websocket','polling']});
let S=null, offset=0, draft={guesses:{}}, lastPhaseKey='', showHelp=false, showScores=false;
const params=new URLSearchParams(location.search);

socket.on('state',st=>{S=st;offset=st.serverNow-Date.now();localStorage.setItem('pg_room',st.code);
  const k=st.phase+'|'+st.roundNo; if(k!==lastPhaseKey){lastPhaseKey=k;window._editing=false;if(st.phase==='conf_answer')window._ans='';if(st.phase==='conf_guess')draft.guesses=st.round.myGuesses?{...st.round.myGuesses}:{};if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}}
  render();});
socket.on('err',m=>toast(m));
socket.on('kicked',()=>{localStorage.removeItem('pg_room');S=null;toast('You were removed from the room');render();});
socket.on('connect',()=>{const rc=localStorage.getItem('pg_room');if(rc)socket.emit('join',{code:rc,playerId:pid,name:'',rejoin:true});});
socket.on('gone',()=>{localStorage.removeItem('pg_room');S=null;render();});
function leave(){if(!confirm('Leave this game?'))return;localStorage.removeItem('pg_room');location.href='/';}
function editAnswer(){window._editing=true;window._ans=S.round.myAnswer;render();}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}
const name=id=>{const p=S.players.find(p=>p.id===id);return p?p.name:'?'};
const me=()=>S.players.find(p=>p.id===S.you);
const isHost=()=>S.host===S.you;
const left=()=>S.endsAt?Math.max(0,Math.ceil((S.endsAt-(Date.now()+offset))/1000)):null;
setInterval(()=>{document.querySelectorAll('[data-timer]').forEach(el=>{const l=left();el.textContent=l===null?'':(el.dataset.timer==='big'?l:'⏱ '+l+'s');el.classList.toggle('low',l!==null&&l<=10);});},250);

const HELP=`
<h2>🍷 How to play</h2>
<p>Everyone joins on their own phone with the <b>room code</b>. No login, no app. Every phone shows the same game screen, so just keep the call going and play.</p>
<h3>🤫 Round type 1: Adulting Confessions</h3>
<ol><li>A prompt pops up. <b>Secretly type your honest (or filthy) answer.</b></li>
<li>All answers are shown <b>anonymously</b>. For each one, <b>guess who wrote it</b>.</li>
<li>Reveal! For every person who guessed you right, <b>you take a sip</b>. Correct guessers get +1 point. If nobody guessed you, you get +2 points for being sneaky.</li></ol>
<h3>⚖️ Round type 2: Group Chat Court</h3>
<ol><li>A “Most likely to…” accusation appears. <b>Vote for the player</b> who fits best.</li>
<li>Most votes = <b>the accused</b> (ties are settled at random). They get <b>30 seconds to defend themselves</b> out loud on the call, or tap “Just drink” to plead guilty (1 sip).</li>
<li>The jury votes <b>🍺 Drink</b> or <b>😇 Acquit</b>. Guilty = 2 sips. Acquitted = everyone who accused them drinks instead.</li></ol>
<h3>🃏 Wild Cards</h3>
<p>Sometimes a Wild Card rule is drawn. Rules <b>stack</b> and stay on screen until the host clears them. If you break one, drink and tap <b>🍺 I drank</b> to log it.</p>
<h3>👑 Host</h3>
<p>The person who created the room is the host. They start rounds, choose Alternate / Confessions only / Court only, and can skip ahead if someone is slow. Timers auto-advance too.</p>
<p class="small muted">Need 3+ players. Drink responsibly, hydrate, and don't drive. Water counts as a sip. 💧</p>`;

function header(){
  return `<div class="top"><span>Room <span class="rc">${S.code}</span></span><span class="timer" data-timer="small"></span>
  <span style="display:flex;gap:6px"><button class="ghost" onclick="showScores=true;render()">🏆</button><button class="ghost" onclick="showHelp=true;render()">❓</button><button class="ghost" onclick="leave()">🚪</button></span></div>`;
}
function rulesBox(){
  if(!S.rules.length)return '';
  return `<div class="rules"><b>🃏 Active Wild Card rules (${S.rules.length})</b><ol>${S.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ol></div>`;
}
function scoreList(){
  const ps=[...S.players].sort((a,b)=>b.sips-a.sips||b.points-a.points);
  return `<ul class="players">${ps.map(p=>`<li class="${p.connected?'':'off'}"><span>${p.isHost?'👑 ':''}${esc(p.name)}${p.id===S.you?' <span class="pill">you</span>':''}</span><span><span class="pill">🍺 ${p.sips}</span><span class="pill">⭐ ${p.points}</span></span></li>`).join('')}</ul>`;
}
function hostBar(extra){
  if(!isHost())return '';
  return `<div class="card"><div class="small muted" style="margin-bottom:6px">👑 Host controls</div>${extra||''}</div>`;
}
function howto(t){return `<div class="howto">${t}</div>`;}
function statusList(doneIds,label,exclude){
  return `<ul class="players">${S.players.filter(p=>p.connected&&p.id!==exclude).map(p=>`<li><span>${esc(p.name)}</span><span class="${doneIds.includes(p.id)?'done':'muted'}">${doneIds.includes(p.id)?'✅ '+label:'⏳ thinking…'}</span></li>`).join('')}</ul>`;
}

function render(){
  const app=$('#app');
  // overlays
  let ov='';
  if(showHelp)ov=`<div class="overlay" onclick="if(event.target===this){showHelp=false;render()}"><div class="modal">${HELP}<button class="pink" onclick="showHelp=false;render()">Got it, let's play</button></div></div>`;
  else if(showScores&&S)ov=`<div class="overlay" onclick="if(event.target===this){showScores=false;render()}"><div class="modal"><h2>🏆 Sip tally & points</h2><p class="small muted">🍺 = sips taken · ⭐ = points for good guessing / sneakiness</p>${scoreList()}<button onclick="showScores=false;render()">Close</button></div></div>`;
  else if(S&&S.newRule&&S.newRule+'|'+S.roundNo!==window._dismissed)ov=`<div class="overlay"><div class="modal wild"><div class="tag">🃏 New Wild Card</div><div class="big">${esc(S.newRule)}</div><p>This rule stacks with the others and stays on until the host clears it.</p><button class="pink" onclick="window._dismissed=S.newRule+'|'+S.roundNo;render()">Ugh, fine 🍻</button></div></div>`;
  $('#ov').innerHTML=ov;
  if(!S){app.innerHTML=homeView();return;}
  const keep=document.activeElement&&document.activeElement.id==='answer'?$('#answer').value:null;
  app.innerHTML=header()+phaseView()+rulesBox()+`<div class="log">${S.log.map(esc).join(' · ')}</div>`+
   `<div class="dock"><button class="teal" onclick="socket.emit('sip')">🍺 I drank (+1)</button><button class="ghost" onclick="showScores=true;render()">🏆 Tally</button></div>`;
  if(keep!==null&&$('#answer')){$('#answer').value=keep;$('#answer').focus();}
  else if($('#answer')&&window._ans){$('#answer').value=window._ans;}
}

function homeView(){
  const code=(params.get('room')||'').toUpperCase();
  return `<h1><span class="a">Adulting Confessions</span><br><span class="b">& Group Chat Court</span></h1>
  <p class="sub">The dirty-minded drinking game for grown-ups 🍷<br>No login, no app. Just a name and a room code.</p>
  <div class="card"><label class="small muted">Your name</label><input id="nm" maxlength="16" placeholder="e.g. Allie" value="${esc(localStorage.getItem('pg_name')||'')}" autocomplete="off">
  <div style="height:10px"></div>
  <label class="small muted">Got a room code from a friend?</label><input id="cd" maxlength="4" placeholder="ABCD" value="${esc(code)}" style="text-transform:uppercase;letter-spacing:.3em;font-weight:800;text-align:center" autocomplete="off">
  <button class="pink" onclick="go('join')">Join room</button>
  <div class="center muted small" style="margin:8px 0">or</div>
  <button onclick="go('create')">👑 Create a new room (I'm the host)</button></div>
  <button class="ghost" onclick="showHelp=true;render()">❓ How to play</button>
  <p class="center small muted">18+ only. Drink responsibly. 💧</p>`;
}
function go(kind){const n=$('#nm').value.trim();if(!n)return toast('Enter your name first');localStorage.setItem('pg_name',n);
  if(kind==='create')socket.emit('create',{name:n,playerId:pid});else{const c=$('#cd').value.trim().toUpperCase();if(c.length!==4)return toast('Enter the 4-letter room code');socket.emit('join',{code:c,name:n,playerId:pid});}}

function modePicker(){
  const m=S.mode;const b=(v,l)=>`<button class="${m===v?'sel':''}" onclick="socket.emit('setMode','${v}')">${l}</button>`;
  return `<div class="small muted" style="margin:4px 0">Round order</div><div class="pick">${b('alt','🔁 Alternate')}${b('conf','🤫 Confessions only')}${b('court','⚖️ Court only')}<button onclick="socket.emit('wild')">🃏 Draw Wild Card</button></div>`+
   (S.rules.length?`<button class="ghost" onclick="socket.emit('clearRules')">Clear all Wild Card rules</button>`:'');
}
const nextLabel=()=>S.nextMode==='conf'?'🤫 Adulting Confessions':'⚖️ Group Chat Court';
function startButtons(){
  const n=S.players.filter(p=>p.connected).length;
  return `<button class="pink" ${n<3?'disabled':''} onclick="socket.emit('start')">▶ Next round: ${nextLabel()}</button>${n<3?`<div class="center small muted">Need at least 3 players (${n} here)</div>`:''}
  <div class="row"><button class="ghost" onclick="socket.emit('start','conf')">🤫 Confessions now</button><button class="ghost" onclick="socket.emit('start','court')">⚖️ Court now</button></div>${modePicker()}`;
}

function phaseView(){
  const r=S.round, ph=S.phase;
  if(ph==='lobby'){
    const link=location.origin+'/?room='+S.code;
    return `<div class="card center"><div class="small muted">Room code. Tell everyone on the call!</div><div class="code">${S.code}</div>
     <div class="small muted">Or share this link:<br><b style="word-break:break-all">${esc(link)}</b></div>
     <button class="ghost" onclick="share('${link}')">📤 Share link</button></div>
     ${howto(isHost()?'<b>You\'re the host 👑.</b> Wait for everyone to join (3+ players), then tap <b>Next round</b>. New here? Tap ❓ up top for the rules.':'<b>You\'re in!</b> Hang tight while the host starts the game. Tap ❓ up top to read the rules while you wait.')}
     <div class="card"><h2>Players (${S.players.length})</h2>${scoreList()}</div>
     ${isHost()?hostBar(startButtons()):''}`;
  }
  const tag=r.type==='conf'?'🤫 Adulting Confessions':'⚖️ Group Chat Court';
  const promptBox=`<div class="prompt ${r.type==='court'?'court':''}"><div class="tag">Round ${S.roundNo} · ${tag}</div><div>${esc(r.prompt)}</div></div>`;

  if(ph==='conf_answer'){
    const done=!!r.myAnswer&&!window._editing;
    return promptBox+howto('<b>Step 1 of 3:</b> Secretly type your answer. Nobody sees who wrote what (yet). Be honest... or be filthy.')+
     (done?`<div class="card center"><div class="done" style="font-size:1.2rem;font-weight:800">✅ Answer locked in</div><div class="muted small">“${esc(r.myAnswer)}”</div><button class="ghost" onclick="editAnswer()">✏️ Change it</button></div>`
       :`<div class="card"><textarea id="answer" maxlength="200" placeholder="Type your confession…" oninput="window._ans=this.value"></textarea><button class="pink" onclick="sendAnswer()">🤫 Submit anonymously</button></div>`)+
     `<div class="card"><h2>Who's answered</h2>${statusList(r.answeredIds,'answered')}</div>`+hostBar(`<button class="ghost" onclick="socket.emit('skip')">⏭ Stop waiting, go to guessing</button>`);
  }
  if(ph==='conf_guess'){
    const sub=!!r.myGuesses;
    const others=S.players.filter(p=>p.id!==S.you);
    const cards=r.cards.map((c,i)=>`<div class="ans"><div class="t">“${esc(c.text)}”</div>${c.mine?'<div class="muted small">😏 This one\'s yours. Act natural.</div>':
      `<div class="small muted" style="margin-bottom:6px">Who wrote this?</div><div class="chips">${others.map(p=>`<button class="${draft.guesses[c.id]===p.id?'sel':''}" ${sub?'disabled':''} onclick="draft.guesses['${c.id}']='${p.id}';render()">${esc(p.name)}</button>`).join('')}</div>`}</div>`).join('');
    const need=r.cards.filter(c=>!c.mine).length, have=Object.keys(draft.guesses).length;
    return promptBox+howto('<b>Step 2 of 3:</b> Here are everyone\'s answers, shuffled. For each one, <b>tap who you think wrote it</b>, then lock in. Bluff all you want on the call.')+cards+
     (sub?`<div class="card center done"><b>✅ Guesses locked in</b></div>`:`<button class="pink" ${have<need?'disabled':''} onclick="socket.emit('guess',draft.guesses)">🔒 Lock in guesses (${have}/${need})</button>`)+
     `<div class="card"><h2>Who's guessed</h2>${statusList(r.guessedIds,'guessed')}</div>`+hostBar(`<button class="ghost" onclick="socket.emit('skip')">⏭ Stop waiting, reveal now</button>`);
  }
  if(ph==='conf_reveal'){
    const res=r.results.map(x=>`<div class="ans"><div class="t">“${esc(x.text)}”</div><div>Written by <span class="who">${esc(name(x.author))}</span></div>
      <div class="small" style="margin-top:6px">${x.correct.length?`🎯 Guessed by ${x.correct.map(name).map(esc).join(', ')} → <b>${esc(name(x.author))} drinks ${x.sips} 🍺</b>`:'🥷 Nobody guessed it! +2 points for being sneaky.'}</div>
      ${x.wrong.length?`<div class="small muted">❌ Wrong: ${x.wrong.map(id=>esc(name(id))).join(', ')}</div>`:''}</div>`).join('');
    return promptBox+howto('<b>Step 3 of 3: The reveal!</b> If people guessed your answer right, take that many sips. Then tell the story behind it. 😈')+res+
     `<div class="card"><h2>🏆 Tally</h2>${scoreList()}</div>`+(isHost()?hostBar(startButtons()):howto('Waiting for the host to start the next round…'));
  }
  if(ph==='court_vote'){
    const others=S.players.filter(p=>p.connected);
    return promptBox+howto('<b>The court is in session.</b> Vote for the player who is <b>most likely</b> to do this. Votes are secret. You can vote for yourself if you\'re honest.')+
     `<div class="card"><div class="pick">${others.map(p=>`<button class="${r.myVote===p.id?'sel':''}" onclick="socket.emit('vote','${p.id}')">${esc(p.name)}${p.id===S.you?' (me)':''}</button>`).join('')}</div>${r.myVote?'<div class="center done small" style="margin-top:8px">✅ Vote cast. Tap another name to change it.</div>':''}</div>`+
     `<div class="card"><h2>Who's voted</h2>${statusList(r.votedIds,'voted')}</div>`+hostBar(`<button class="ghost" onclick="socket.emit('skip')">⏭ Close the vote now</button>`);
  }
  const tallyBox=()=>{const tot=Object.values(r.tally).reduce((a,b)=>a+b,0);return `<div class="card"><h2>🗳 Votes</h2>${Object.entries(r.tally).sort((a,b)=>b[1]-a[1]).map(([id,n])=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><span>${esc(name(id))}</span><b>${n}</b></div><div class="bar"><i style="width:${100*n/tot}%"></i></div></div>`).join('')}</div>`};
  if(ph==='court_defense'){
    const mine=r.guilty===S.you;
    return promptBox+`<div class="card center"><div class="muted">The court finds…</div><div class="guilty">🚨 ${esc(name(r.guilty))} 🚨</div>${r.tie?'<div class="small muted">(It was a tie. Fate picked.)</div>':''}
     <div class="muted">Defense time remaining</div><div class="big-timer" data-timer="big"></div></div>`+
     howto(mine?'<b>You\'ve been accused!</b> You have 30 seconds to <b>defend yourself out loud</b> on the call. Or skip it and tap <b>Just drink</b> (1 sip). After your defense, the jury decides: acquit, or 2 sips.':`<b>Defense time.</b> ${esc(name(r.guilty))} has 30 seconds to plead their case out loud. Heckling is encouraged. Then you'll vote: drink or acquit.`)+
     (mine?`<button class="red" onclick="socket.emit('plead')">🍺 Just drink (plead guilty, 1 sip)</button><button class="teal" onclick="socket.emit('rest')">🎤 I rest my case. Jury, vote now.</button>`:'')+tallyBox()+
     (isHost()&&!mine?hostBar(`<button class="ghost" onclick="socket.emit('rest')">⏭ End defense early</button>`):'');
  }
  if(ph==='court_judge'){
    const mine=r.guilty===S.you;
    return promptBox+`<div class="card center"><div class="muted">On trial</div><div class="guilty">${esc(name(r.guilty))}</div></div>`+
     howto(mine?'<b>The jury is deciding your fate.</b> Sit there and look innocent. 😇':'<b>Jury vote:</b> was that defense convincing? <b>🍺 Drink</b> = 2 sips for them. <b>😇 Acquit</b> = everyone who voted for them drinks instead. Ties go to Drink.')+
     (mine?'':`<div class="row"><button class="red ${r.myJudgment==='drink'?'':''}" style="${r.myJudgment==='drink'?'outline:4px solid #fff':''}" onclick="socket.emit('judge','drink')">🍺 Drink!</button><button class="teal" style="${r.myJudgment==='acquit'?'outline:4px solid #fff':''}" onclick="socket.emit('judge','acquit')">😇 Acquit</button></div>`)+
     `<div class="card"><h2>Jury</h2>${statusList(r.judgedIds,'decided',r.guilty)}</div>`+hostBar(`<button class="ghost" onclick="socket.emit('skip')">⏭ Close the jury vote</button>`);
  }
  if(ph==='court_done'){
    const o=r.outcome, g=esc(name(r.guilty));
    const msg=o.verdict==='pleaded'?`${g} pleaded guilty and takes <b>1 sip</b> 🍺`:o.verdict==='guilty'?`GUILTY! ${g} drinks <b>2 sips</b> 🍺🍺<div class="small muted">Jury: ${o.drink} drink · ${o.acquit} acquit</div>`:`ACQUITTED! 😇 Everyone who accused ${g} drinks <b>1 sip</b>.<div class="small muted">Jury: ${o.drink} drink · ${o.acquit} acquit</div>`;
    return promptBox+`<div class="card center"><div class="tag">⚖️ Verdict</div><div style="font-size:1.3rem;font-weight:800">${msg}</div></div>`+tallyBox()+
     `<div class="card"><h2>🏆 Tally</h2>${scoreList()}</div>`+(isHost()?hostBar(startButtons()):howto('Waiting for the host to start the next round…'));
  }
  return '';
}
function sendAnswer(){const v=$('#answer').value.trim();if(!v)return toast('Type something first 😏');window._ans='';window._editing=false;socket.emit('answer',v);}
function share(link){if(navigator.share)navigator.share({title:'Join my game',text:'Room code '+S.code,url:link}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(link);toast('Link copied!');}}
render();
if(!localStorage.getItem('pg_seen_help')){showHelp=true;localStorage.setItem('pg_seen_help','1');render();}
</script>
